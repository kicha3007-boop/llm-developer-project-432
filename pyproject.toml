[project]
name = "product-card-generator"
version = "0.1.0"
description = "ИИ-генератор карточки товара по документам поставщиков"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "openai>=1.60",
    "openai-agents>=0.2",
    "temporalio>=1.9",
    "structlog>=24.4",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]
# Тяжёлая группа: локальная модель эмбеддингов. Тесты её не требуют (модель подменяется).
embeddings = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]

[tool.uv]
package = false
default-groups = ["dev", "embeddings"]

# torch берём из CPU-индекса: CUDA-сборка весит гигабайты и для эмбеддингов на процессоре не нужна
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003: в проекте много русского текста, «двусмысленные» кириллические символы — норма
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: тест на живой базе PostgreSQL (пропускается, если база недоступна)",
    "integration: тест на живом Temporal (пропускается, если сервер недоступен)",
]
